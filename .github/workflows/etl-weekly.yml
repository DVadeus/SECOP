name: ETL SECOP incremental

on:
  schedule:
    # Lunes 06:00 UTC (01:00 hora Colombia).
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      year:
        description: "Re-procesar sólo este año (deja vacío para el incremental normal)"
        required: false
        default: ""

concurrency:
  group: secop-etl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  etl:
    runs-on: ubuntu-latest
    # La foto ligera del origen tarda ~10 min; el resto depende de cuánto cambió.
    timeout-minutes: 120
    env:
      SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sincronizar dependencias (sin grupo analysis)
        run: uv sync --no-group analysis --no-group dev

      - name: Incremental contratos
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.year == '' }}
        # Un reintento: el origen se recarga a diario y, si ocurre durante la
        # foto, la corrida aborta sin escribir nada (es idempotente).
        run: uv run secop etl incremental || (sleep 900 && uv run secop etl incremental)

      - name: Incremental interadministrativos
        # always(): corre aunque falle el paso de contratos (bases independientes).
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.year == '') }}
        run: >-
          uv run secop etl incremental --base interadministrativos
          || (sleep 900 && uv run secop etl incremental --base interadministrativos)

      - name: Re-procesar un año
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.year != '' }}
        run: uv run secop etl backfill --year "${{ inputs.year }}" --force
