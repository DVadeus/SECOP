[project]
name = "secop"
version = "0.2.0"
description = "ETL incremental de contratos SECOP II (datos.gov.co) hacia Cloudflare R2 + CLI de consultas DuckDB"
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "boto3>=1.40.0",
    "duckdb>=1.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
]

[project.scripts]
secop = "secop.cli:app"

[dependency-groups]
dev = [
    "basedpyright>=1.39.4",
    "pandas-stubs>=2.3.0.250703",
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.12",
]
analysis = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secop"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false
reportAny = false
reportOptionalMemberAccess = true
reportOptionalSubscript = true
reportOptionalCall = true
reportGeneralTypeIssues = true
reportUntypedFunctionDecorator = false
reportMissingImports = true
reportUnusedImport = true
reportUnboundVariable = true
reportPossiblyUnboundVariable = true
exclude = ["**/__pycache__", ".venv", "venv", "notebooks", "data"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: pruebas que tocan la API Socrata o R2 real (excluidas por defecto)",
]
addopts = "-m 'not integration'"
